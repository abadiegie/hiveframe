[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hiveframe"
version = "0.1.2"
description = "Transactional, distributed-ready pandas-compatible DataFrame engine."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Database",
    "Topic :: Scientific/Engineering",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=15.0",
    "msgpack>=1.0",
]

[project.urls]
Homepage = "https://github.com/abadiegie/hiveframe"
Documentation = "https://abadiegie.github.io/hiveframe/"
Source = "https://github.com/abadiegie/hiveframe"
"Bug Tracker" = "https://github.com/abadiegie/hiveframe/issues"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]
nats = [
    "nats-py>=2.7",
]
quic = [
    "aioquic>=1.2",
]
transport = [
    "nats-py>=2.7",
    "aioquic>=1.2",
]
benchmark = [
    "psutil>=5.9",
]
excel = [
    "openpyxl>=3.1",
]
redis = [
    "redis>=5.0",
]
mysql = [
    "pymysql>=1.1",
]
all = [
    "openpyxl>=3.1",
    "nats-py>=2.7",
    "aioquic>=1.2",
    "redis>=5.0",
    "pymysql>=1.1",
    "psutil>=5.9",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.setuptools]
# Package core/ and agent/ as subpackages of the hiveframe namespace so installed package
# layout becomes hiveframe, hiveframe.core, hiveframe.agent (no source movement required).
packages = ["hiveframe", "hiveframe.core", "hiveframe.agent"]

[tool.setuptools.package-dir]
# Map the hiveframe.* package names to the existing source directories.
hiveframe = "hiveframe"
"hiveframe.core" = "core"
"hiveframe.agent" = "agent"
